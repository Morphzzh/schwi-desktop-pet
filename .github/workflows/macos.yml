name: Build and test macOS desktop pet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Check architecture and behavior
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python -c 'import os,platform; assert platform.machine() == os.environ["EXPECTED_ARCH"]'
          python -m unittest discover -s tests -v
      - name: Build native app and verify ad-hoc signature
        run: python build_macos.py
      - name: Test the app using Cocoa
        run: python verify_macos.py
      - name: Package application preserving macOS metadata
        run: python package_macos.py
      - name: Check launch after extracting the ZIP
        run: |
          mkdir -p 'extract-check/中文 path'
          /usr/bin/ditto -x -k dist-macos/SchwiPet-*-macOS-${{ matrix.arch }}.zip 'extract-check/中文 path'
          python verify_macos.py --app 'extract-check/中文 path/SchwiPet-macOS-${{ matrix.arch }}/SchwiPet.app' --output qa-macos-extracted
      - name: Save tested application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SchwiPet-macOS-${{ matrix.arch }}
          path: |
            dist-macos/*.zip
            dist-macos/*.sha256
            dist-macos/build-info.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macOS-verification-${{ matrix.arch }}
          path: |
            qa-macos/
            qa-macos-extracted/
            build-macos/**/warn-*.txt
          if-no-files-found: warn
          retention-days: 30
